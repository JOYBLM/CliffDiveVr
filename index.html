 fragmentShader:`uniform float uT;uniform vec4 uR[8];uniform vec3 uSun;uniform vec3 uFog;uniform float uFogD;varying vec3 vW;varying float vH;

[new THREE.ConeGeometry(.22,1.1,5).translate(0,.55,0),new THREE.IcosahedronGeometry(.45,0).translate(0,.3,0).scale(1,.7,1),new THREE.CylinderGeometry(.08,.12,1,5).translate(0,.5,0)].forEach(g=>{

const smat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0,fog:false}),streak=new THREE.LineSegments(sg,smat);streak.frustumCulled=false;scene.add(streak);
let vig;{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.45,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.85)');g.fillStyle=gr;g.fillRect(0,0,128,128);
 vig=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false,depthWrite:false,opacity:0,fog:false}));vig.position.z=-.25;vig.renderOrder=999;camera.add(vig)}

// ---------- audio ----------
let ac,wind,ocean,nb;
function initAudio(){if(ac){ac.resume();return}ac=new(window.AudioContext||window.webkitAudioContext)();nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1;
 const loop=(type,f,g)=>{const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;const gn=ac.createGain();gn.gain.value=g;s.connect(fl);fl.connect(gn);gn.connect(ac.destination);s.start();return{fl,gn}};
 wind=loop('bandpass',500,0);ocean=loop('lowpass',450,.1)}
function burst(f0,f1,vol,dur){if(!ac)return;const s=ac.createBufferSource();s.buffer=nb;const fl=ac.createBiquadFilter();fl.type='lowpass';const t=ac.currentTime;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
 const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start(t,rnd(),dur+.05)}
function tone(f0,f1,vol,dur){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.05)}

// ---------- collision ----------
const _c=V(),_d=V(),_o=V(),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function push(p,r,b){_c.set(cl(p.x,b.min.x,b.max.x),cl(p.y,b.min.y,b.max.y),cl(p.z,b.min.z,b.max.z));_d.subVectors(p,_c);const d2=_d.lengthSq();if(d2>=r*r)return null;
 if(d2>1e-10){const d=Math.sqrt(d2);return _o.copy(_d).multiplyScalar((r-d)/d)}
 const e=[p.x-b.min.x,b.max.x-p.x,p.y-b.min.y,b.max.y-p.y,p.z-b.min.z,b.max.z-p.z];let k=0;for(let i=1;i<6;i++)if(e[i]<e[k])k=i;
 const s=k%2?1:-1;_o.set(0,0,0);if(k<2)_o.x=s*(e[k]+r);else if(k<4)_o.y=s*(e[k]+r);else _o.z=s*(e[k]+r);return _o}

// ---------- state & shared actions ----------
const vel=V(),lastMove=V(),headP=V(),bodyP=V(),headC=V(),tmp=V(),tot=V(),hv=V(),cp=V(0,1.1,44),flatHand={wp:V(),sv:V(),held:null};
let supported=false,wallT=false,inWater=false,climb=false,prevClimb=false,airTop=0,frame=0,lastSlap=0,lastJ=0,cur=0,nextGull=5,wl=0,yaw=0,pitch=0;
D.position.set(0,cp.y-1.7,44);flag.position.set(0,.4,44);camera.rotation.order='YXZ';
const refresh=()=>{D.updateMatrixWorld(true);hands.forEach(h=>h.c.getWorldPosition(h.wp));camera.getWorldPosition(headP)};
const teleport=p=>{D.position.set(p.x-(headP.x-D.position.x),p.y-(headP.y-D.position.y),p.z-(headP.z-D.position.z));vel.set(0,0,0);airTop=p.y;refresh()};
function setCP(h){if(inWater)return;cp.copy(headP);cp.y+=.25;flag.position.set(cp.x,gy(cp),cp.z);tone(880,1320,.2,.25);if(h)buzz(h,.6,60)}
function respawn(h){teleport(cp);if(h)buzz(h,.4,60)}
function platGo(d){cur=Math.max(0,Math.min(plats.length-1,cur+d));teleport(plats[cur].p)}
renderer.xr.addEventListener('sessionstart',()=>{initAudio();$('info').style.display='none';setTimeout(()=>teleport(plats[0].p),500)});
renderer.xr.addEventListener('sessionend',()=>{camera.position.set(0,1.7,0);yaw=pitch=0;$('info').style.display='';refresh();teleport(cp)});
const clock=new THREE.Clock();

// ---------- PC + mobile input ----------
const keys={},joy={x:0,y:0};let touchJump=false;const vrOn=()=>renderer.xr.isPresenting;
addEventListener('keydown',e=>{keys[e.code]=1;if(e.repeat||vrOn())return;if(e.code==='KeyC')setCP();if(e.code==='KeyR')respawn();if(e.code==='KeyE')platGo(1);if(e.code==='KeyQ')platGo(-1);if(e.code==='KeyF')flatGrab()});
addEventListener('keyup',e=>{keys[e.code]=0});
const cv=renderer.domElement;
cv.addEventListener('click',()=>{if(!mobile&&!vrOn()&&document.pointerLockElement!==cv)cv.requestPointerLock()});
addEventListener('mousemove',e=>{if(document.pointerLockElement===cv){yaw-=e.movementX*.0022;pitch=cl(pitch-e.movementY*.0022,-1.5,1.5)}});
addEventListener('mousedown',e=>{if(document.pointerLockElement===cv&&e.button===0)flatGrab()});
const looks=new Map();
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')looks.set(e.pointerId,[e.clientX,e.clientY])});
cv.addEventListener('pointermove',e=>{const l=looks.get(e.pointerId);if(!l)return;yaw-=(e.clientX-l[0])*.005;pitch=cl(pitch-(e.clientY-l[1])*.005,-1.5,1.5);l[0]=e.clientX;l[1]=e.clientY});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>looks.delete(e.pointerId)));
const joyEl=$('joy'),knob=$('knob');let jid=null;
function jmove(e){const r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+65),dy=e.clientY-(r.top+65),m=Math.min(1,Math.hypot(dx,dy)/55),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*m;joy.y=Math.sin(a)*m;knob.style.transform=`translate(${joy.x*45}px,${joy.y*45}px)`}
joyEl.addEventListener('pointerdown',e=>{jid=e.pointerId;joyEl.setPointerCapture(jid);jmove(e)});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;joy.x=joy.y=0;knob.style.transform=''}};joyEl.addEventListener('pointerup',jend);joyEl.addEventListener('pointercancel',jend);
const bind=(id,down,up)=>{const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();down()});if(up){el.addEventListener('pointerup',up);el.addEventListener('pointerleave',up)}};
bind('bJ',()=>touchJump=true,()=>touchJump=false);bind('bG',()=>flatGrab());bind('bC',()=>setCP());bind('bR',()=>respawn());bind('bU',()=>platGo(1));bind('bD',()=>platGo(-1));
function flatGrab(){if(vrOn())return;camera.getWorldDirection(sd);
 if(flatHand.held){const r=flatHand.held;r.v.copy(sd).multiplyScalar(13).add(vel);r.held=null;flatHand.held=null;return}
 let b=null,bd=3.2;rocks.forEach(r=>{tmp.subVectors(r.p,headP);const d=tmp.length();if(!r.held&&d<bd&&tmp.normalize().dot(sd)>.5){bd=d;b=r}});if(b){b.held=flatHand;flatHand.held=b}}
function bump(c,r){for(const bx of boxes){const p=push(c,r,bx);if(p){D.position.add(p);c.add(p);tmp.copy(p).normalize();const vn=vel.dot(tmp);if(vn<0)vel.addScaledVector(tmp,-vn);if(tmp.y>.5)supported=true;else if(Math.abs(tmp.y)<.4)wallT=true}}}
function flatStep(dt){
 climb=false;camera.position.set(0,1.7,0);camera.rotation.set(pitch,yaw,0,'YXZ');
 let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,mz=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joy.y;const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l}
 const jump=keys.Space||touchJump,sprint=keys.ShiftLeft||keys.ShiftRight,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
 vel.y-=(inWater?G*.1:G)*dt;
 if(inWater){camera.getWorldDirection(sd);vel.multiplyScalar(Math.max(0,1-3*dt));vel.y+=Math.max(0,Math.min(3,(.55-(headP.y-wl))*3))*dt;
  vel.addScaledVector(sd,mz*10*dt);vel.x+=rx*mx*8*dt;vel.z+=rz*mx*8*dt;if(jump)vel.y+=9*dt;if(sprint)vel.y-=7*dt;vel.clampLength(0,7)}
 else{const sp=vel.length();vel.multiplyScalar(Math.max(0,1-.003*sp*dt));
  if(mx||mz){const s=sprint?8:5.5,k=Math.min(1,(supported?12:1.8)*dt);vel.x+=((fx*mz+rx*mx)*s-vel.x)*k;vel.z+=((fz*mz+rz*mx)*s-vel.z)*k}
  else if(supported){vel.x*=Math.max(0,1-10*dt);vel.z*=Math.max(0,1-10*dt)}
  if(jump&&supported&&frame>2&&performance.now()/1000-lastJ>.3){vel.y=6.5;lastJ=performance.now()/1000}
  else if(jump&&wallT&&!supported)vel.y=Math.max(vel.y,3)}
 D.position.addScaledVector(vel,dt);refresh();
 supported=false;wallT=false;bodyP.set(headP.x,D.position.y+.4,headP.z);bump(bodyP,.33);refresh();headC.copy(headP);bump(headC,.2);refresh();
 camera.getWorldDirection(sd);flatHand.wp.copy(headP).addScaledVector(sd,.7);flatHand.wp.y-=.2}

// ---------- VR step (Gorilla Tag arms) ----------
function vrStep(dt){
 hands.forEach(h=>{if(!h.init){h.last.copy(h.c.position);h.init=1}
  h.rv.copy(h.c.position).sub(h.last).divideScalar(dt);h.last.copy(h.c.position);h.sv.lerp(h.rv,.4);
  const b=h.gp?h.gp.buttons:[];h.grip=!!(b[1]&&b[1].pressed);
  const a=!!(b[4]&&b[4].pressed),c=!!(b[5]&&b[5].pressed);h.dA=a&&!h.pA;h.dB=c&&!h.pB;h.gd=h.grip&&!h.pG;h.pA=a;h.pB=c;h.pG=h.grip});
 hands.forEach(h=>{
  if(h.side==='right'){if(h.dA)setCP(h);if(h.dB)respawn(h)}
  if(h.side==='left'){if(h.dA)platGo(1);if(h.dB)platGo(-1)}});
 hands.forEach(h=>{
  if(h.gd&&!h.held&&!h.grab){const r=rocks.find(k=>!k.held&&k.p.distanceTo(h.wp)<.3);
   if(r){r.held=h;h.held=r;buzz(h,.2,25)}else if(boxes.some(bx=>push(h.wp,.35,bx))){h.grab=true;h.anc.copy(h.wp);buzz(h,.3,30)}}
  if(!h.grip){if(h.held){const r=h.held;r.held=null;r.v.copy(h.sv).add(vel).multiplyScalar(1.15);h.held=null;buzz(h,.25,30)}h.grab=false}});
 const gr=hands.filter(h=>h.grab);climb=gr.length>0;let pushed=false,contact=false;
 if(climb){tmp.set(0,0,0);gr.forEach(h=>tmp.add(hv.subVectors(h.anc,h.wp)));tmp.divideScalar(gr.length);D.position.add(tmp);lastMove.lerp(tmp.divideScalar(dt),.3);vel.set(0,0,0);supported=true;refresh()}
 else{
  if(prevClimb)vel.copy(lastMove).multiplyScalar(.6).clampLength(0,8);
  const sp=vel.length();vel.y-=(inWater?G*.1:G)*dt;
  if(inWater){vel.multiplyScalar(Math.max(0,1-3*dt));vel.y+=Math.max(0,Math.min(3,(.55-(headP.y-wl))*3))*dt;camera.getWorldDirection(sd);
   hands.forEach(h=>{if(h.wp.y<wl){const f=-h.rv.dot(sd);if(f>.3)vel.addScaledVector(sd,f*6*dt);if(h.rv.y<-.3)vel.y-=h.rv.y*5*dt;if(h.rv.length()>1&&frame%6===0)addRipple(h.wp.x,h.wp.z,.15)}});vel.clampLength(0,7)}
  else vel.multiplyScalar(Math.max(0,1-(.003*sp+.12)*dt));
  D.position.addScaledVector(vel,dt);refresh();
  // hands grip surfaces: pushed out AND dragged opposite to their sliding motion
  hands.forEach(h=>{h.pd.set(0,0,0);for(const bx of boxes){const p=push(h.wp,.1,bx);if(p){tmp.copy(p).normalize();hv.copy(h.rv).multiplyScalar(dt);hv.addScaledVector(tmp,-hv.dot(tmp));p.addScaledVector(hv,-.9);h.pd.add(p);D.position.add(p);refresh()}}if(h.pd.lengthSq()>0)pushed=true});
  if(pushed){let b=hands[0],bm=0;hands.forEach(h=>{const m=h.pd.length();if(m>bm){bm=m;b=h}});
   hv.copy(b.pd).divideScalar(dt).multiplyScalar(.95).clampLength(0,9);
   if(hv.length()>1.2)vel.lerp(hv,.7);else vel.multiplyScalar(Math.max(0,1-12*dt));   // small movements = no launch, no bounce
   hands.forEach(h=>{const s=h.pd.length()/dt;if(s>1.5){buzz(h,s/9,35);if(performance.now()/1000-lastSlap>.12){lastSlap=performance.now()/1000;burst(600,150,Math.min(.5,s/18),.1)}}})}
  refresh();
  bodyP.copy(headP);bodyP.y-=.05;
  for(const bx of boxes){const p=push(bodyP,.2,bx);if(p){D.position.add(p);bodyP.add(p);tmp.copy(p).normalize();const vn=vel.dot(tmp);if(vn<0)vel.addScaledVector(tmp,-vn);if(tmp.y>.5){contact=true;vel.x*=Math.max(0,1-8*dt);vel.z*=Math.max(0,1-8*dt)}}}
  supported=pushed||contact;refresh();
 }
 hands.forEach(h=>{const hw=waveH(h.wp.x,h.wp.z,T);if(h.py>.05&&h.wp.y-hw<=.05){const s=h.rv.length();if(s>1.5){tmp.set(h.wp.x,0,h.wp.z);splash(tmp,Math.min(s,6));burst(1500,300,Math.min(.3,s/15),.15);buzz(h,s/8,40)}}h.py=h.wp.y-hw})}

// ---------- main loop ----------
renderer.setAnimationLoop(()=>{
 const dt=Math.min(clock.getDelta(),.05)||.014,vr=vrOn();T+=dt;frame++;wl=waveH(headP.x,headP.z,T);refresh();
 if(vr)vrStep(dt);else flatStep(dt);
 prevClimb=climb;
 // water entry + dive rating
 const wasW=inWater,rel=headP.y-wl;inWater=wasW?rel<.45:rel<.05;
 if(inWater&&!wasW){const s=Math.max(-vel.y,.5*Math.hypot(vel.x,vel.z));
  if(s>2){const ang=Math.abs(vel.y)/Math.max(.1,vel.length()),big=airTop>3&&s>9;let rate='',mul=1;
   if(big){rate=ang>.93?'PERFECT!':ang>.7?'Good dive':'BELLY FLOP!';mul=ang>.93?.75:ang>.7?1:1.7}
   tmp.set(headP.x,0,headP.z);splash(tmp,s*mul);burst(2500,250,Math.min(1,(.15+s/30)*mul),.35+s*.015);if(s>12)tone(150,35,Math.min(1,s/40),.5);
   buzzAll((.2+s/30)*mul,150+s*8);bubbles(headP,20+s*2|0,1.2);
   if(airTop>3){lastDive=airTop;lastRate=rate;best=Math.max(best,airTop);showPopup((rate?rate+'  ':'')+airTop.toFixed(0)+' m',headP)}}}
 if(inWater&&frame%10===0&&vel.length()>.8)addRipple(headP.x,headP.z,.12);
 if(supported||climb||inWater)airTop=headP.y;else airTop=Math.max(airTop,headP.y);
 // rocks
 rocks.forEach(r=>{
  if(r.held){r.p.copy(r.held.wp);r.v.set(0,0,0)}
  else{const wr=waveH(r.p.x,r.p.z,T),was=r.p.y>wr;r.v.y-=(r.p.y<wr?3:G)*dt;if(r.p.y<wr)r.v.multiplyScalar(Math.max(0,1-3*dt));r.p.addScaledVector(r.v,dt);
   for(const bx of boxes){const p=push(r.p,r.r,bx);if(p){r.p.add(p);tmp.copy(p).normalize();const vn=r.v.dot(tmp);if(vn<0){r.v.addScaledVector(tmp,-1.35*vn);if(r.v.length()<.6&&tmp.y>.5)r.v.set(0,0,0)}if(tmp.y>.5){r.v.x*=Math.max(0,1-4*dt);r.v.z*=Math.max(0,1-4*dt)}}}
   if(was&&r.p.y<wr){const s=r.v.length();if(s>1.5){splash(r.p,Math.min(s*.7,14));burst(1800,300,Math.min(.5,s/20),.25)}}
   if(r.p.y<-8||Math.abs(r.p.x)>500||Math.abs(r.p.z)>500){r.p.copy(r.home);r.v.set(0,0,0)}}
  r.m.position.copy(r.p);r.m.rotation.x+=r.v.z*dt*2;r.m.rotation.z-=r.v.x*dt*2});
 if(headP.y<-35||Math.abs(headP.x)>450||Math.abs(headP.z)>450)teleport(cp);
 // fish: schools drift around the reefs and scatter when you come close
 schools.forEach(s=>{s.a+=s.s*dt;s.t.set(s.c.x+Math.cos(s.a)*s.r,s.y+Math.sin(s.a*2)*1.5,s.c.z+Math.sin(s.a)*s.r*.6)});
 fish.forEach((f,i)=>{const s=schools[f.sch];tmp.copy(s.t).add(f.off);tmp.x+=Math.sin(T*.8+f.ph)*1.2;tmp.sub(f.p);const d=tmp.length();f.v.lerp(tmp.normalize().multiplyScalar(Math.min(3,1+d*.8)),dt*1.5);
  hv.subVectors(f.p,headP);if(hv.lengthSq()<16)f.v.addScaledVector(hv.normalize(),dt*14);
  f.p.addScaledVector(f.v,dt);f.p.y=cl(f.p.y,-9.5,-1.5);const th=Math.atan2(-f.v.z,f.v.x);
  fo.position.copy(f.p);fo.rotation.set(0,th,0);fo.updateMatrix();fb.setMatrixAt(i,fo.matrix);
  ftO.position.set(f.p.x-Math.cos(th)*.27,f.p.y,f.p.z+Math.sin(th)*.27);ftO.rotation.set(0,th+Math.sin(T*10+f.ph)*.5,0);ftO.updateMatrix();ft.setMatrixAt(i,ftO.matrix)});
 fb.instanceMatrix.needsUpdate=ft.instanceMatrix.needsUpdate=true;
 // ---------- feel ----------
 const sp=vel.length(),air=!supported&&!climb&&!inWater,uw=headP.y-wl<.05;
 if(ac&&wind){const w=air?Math.pow(Math.min(1,sp/45),1.4)*.9:0;wind.gn.gain.value+=(w-wind.gn.gain.value)*.15;wind.fl.frequency.value=300+sp*30;
  ocean.gn.gain.value=uw?.25:.09+.03*Math.sin(T*.7);ocean.fl.frequency.value=uw?200:500}
 if(air&&sp>14&&frame%3===0)buzzAll((sp-14)/80,50);
 if(ac&&T>nextGull){nextGull=T+7+rnd()*10;if(!uw){tone(1900,1250,.05,.28);setTimeout(()=>tone(1700,1100,.04,.22),260)}}
 smat.opacity=Math.min(.6,Math.max(0,(sp-12)/30));vig.material.opacity=Math.min(.9,Math.max(0,(sp-18)/32));
 if(smat.opacity>0){sd.copy(vel).normalize();const len=sp*.04;for(let i=0;i<NS;i++){const q=sq[i];if(q.distanceToSquared(headP)>196){q.set(rnd()-.5,rnd()-.5,rnd()-.5).multiplyScalar(12).add(headP).addScaledVector(sd,rnd()*8)}
  sa.set([q.x,q.y,q.z,q.x-sd.x*len,q.y-sd.y*len,q.z-sd.z*len],i*6)}sg.attributes.position.needsUpdate=true}
 if(uw&&frame%6===0)bubbles(headP,1,.6);
 for(let i=0;i<NB;i++)if(bl[i]>0){bl[i]-=dt;bp[i*3+1]+=.7*dt;bp[i*3]+=Math.sin(T*3+i)*.2*dt;if(bl[i]<=0||bp[i*3+1]>wl){bl[i]=0;bp[i*3+1]=-999}}bg.attributes.position.needsUpdate=true;
 for(let i=0;i<N;i++)if(pl[i]>0){pl[i]-=dt;pv[i*3+1]-=G*dt;for(let a=0;a<3;a++)pp[i*3+a]+=pv[i*3+a]*dt;if(pl[i]<=0||pp[i*3+1]<-.1){pl[i]=0;pp[i*3+1]=-999}}pg.attributes.position.needsUpdate=true;
 if(popL>0){popL-=dt;popup.material.opacity=Math.min(1,popL);if(popL<=0)popup.visible=false}
 clouds.forEach(c=>{c.position.x+=dt*3;if(c.position.x>750)c.position.x=-750});
 gulls.forEach(g=>{const u=g.userData;u.a+=u.s*dt;g.position.set(Math.cos(u.a)*u.r,u.y+Math.sin(T+u.ph)*2,-10+Math.sin(u.a)*u.r);g.rotation.y=-u.a;u.w1.rotation.z=Math.sin(T*7+u.ph)*.7;u.w2.rotation.z=-u.w1.rotation.z});
 const fc=uw?DEEP:SKY,fd=uw?.06:.0022;scene.background.copy(fc);scene.fog.color.copy(fc);scene.fog.density=fd;skyMesh.visible=!uw;
 WU.uT.value=T;WU.uFog.value.copy(fc);WU.uFogD.value=fd;
 if(frame%8===0){if(vr)drawHud(Math.max(0,headP.y),sp);else $('hud').textContent='Height '+Math.max(0,headP.y).toFixed(0)+' m\nSpeed '+(sp*3.6).toFixed(0)+' km/h\nLast '+lastDive.toFixed(0)+' m '+lastRate+'\nBest '+best.toFixed(0)+' m'}
 $('hud').style.display=vr?'none':'';
 renderer.render(scene,camera)});
</script></body></html>

const vel=V(),lastMove=V(),headP=V(),bodyP=V(),tmp=V(),tot=V(),hv=V(),cp=V(0,1.1,44);

const clock=new THREE.Clock();

 const dt=Math.min(clock.getDelta(),.05)||.014;T+=dt;frame++;refresh();

  if(r.held){r.p.copy(r.held.wp);r.v.set(0,0,0)}
  else{const was=r.p.y>0;r.v.y-=(r.p.y<0?3:G)*dt;if(r.p.y<0)r.v.multiplyScalar(Math.max(0,1-3*dt));r.p.addScaledVector(r.v,dt);
   for(const bx of boxes){const p=push(r.p,r.r,bx);if(p){r.p.add(p);tmp.copy(p).normalize();const vn=r.v.dot(tmp);if(vn<0){r.v.addScaledVector(tmp,-1.35*vn);if(r.v.length()<.6&&tmp.y>.5)r.v.set(0,0,0)}if(tmp.y>.5){r.v.x*=Math.max(0,1-4*dt);r.v.z*=Math.max(0,1-4*dt)}}}
   if(was&&r.p.y<0){const s=r.v.length();if(s>1.5){splash(r.p,Math.min(s*.7,14));burst(1800,300,Math.min(.5,s/20),.25)}}
   if(r.p.y<-8||Math.abs(r.p.x)>500||Math.abs(r.p.z)>500){r.p.copy(r.home);r.v.set(0,0,0)}}
  r.m.position.copy(r.p);r.m.rotation.x+=r.v.z*dt*2;r.m.rotation.z-=r.v.x*dt*2});
 if(headP.y<-35||Math.abs(headP.x)>450||Math.abs(headP.z)>450)teleport(cp);
 // ---------- feel ----------
 const sp=vel.length(),air=!supported&&!climb&&!inWater,uw=headP.y<.05;
 if(ac&&wind){const w=air?Math.pow(Math.min(1,sp/45),1.4)*.9:0;wind.gn.gain.value+=(w-wind.gn.gain.value)*.15;wind.fl.frequency.value=300+sp*30;
  ocean.gn.gain.value=uw?.25:.09+.03*Math.sin(T*.7);ocean.fl.frequency.value=uw?200:500}
 if(air&&sp>14&&frame%3===0)buzzAll((sp-14)/80,50);
 if(ac&&T>nextGull){nextGull=T+7+rnd()*10;if(!uw){tone(1900,1250,.05,.28);setTimeout(()=>tone(1700,1100,.04,.22),260)}}
 // speed lines + tunnel vision
 smat.opacity=Math.min(.6,Math.max(0,(sp-12)/30));vig.material.opacity=Math.min(.9,Math.max(0,(sp-18)/32));
 if(smat.opacity>0){sd.copy(vel).normalize();const len=sp*.04;for(let i=0;i<NS;i++){const q=sq[i];if(q.distanceToSquared(headP)>196){q.set(rnd()-.5,rnd()-.5,rnd()-.5).multiplyScalar(12).add(headP).addScaledVector(sd,rnd()*8)}
  sa.set([q.x,q.y,q.z,q.x-sd.x*len,q.y-sd.y*len,q.z-sd.z*len],i*6)}sg.attributes.position.needsUpdate=true}
 // bubbles, particles, rings
 if(uw&&frame%6===0)bubbles(headP,1,.6);
 for(let i=0;i<NB;i++)if(bl[i]>0){bl[i]-=dt;bp[i*3+1]+=.7*dt;bp[i*3]+=Math.sin(T*3+i)*.2*dt;if(bl[i]<=0||bp[i*3+1]>0){bl[i]=0;bp[i*3+1]=-999}}bg.attributes.position.needsUpdate=true;
 for(let i=0;i<N;i++)if(pl[i]>0){pl[i]-=dt;pv[i*3+1]-=G*dt;for(let a=0;a<3;a++)pp[i*3+a]+=pv[i*3+a]*dt;if(pl[i]<=0||pp[i*3+1]<-.1){pl[i]=0;pp[i*3+1]=-999}}pg.attributes.position.needsUpdate=true;
 rings.forEach(q=>{if(q.l>0){q.l-=dt*.8;q.s+=dt*q.k*4;q.m.scale.setScalar(q.s);q.m.material.opacity=Math.max(0,q.l)*.8;if(q.l<=0)q.m.visible=false}});
 if(popL>0){popL-=dt;popup.material.opacity=Math.min(1,popL);if(popL<=0)popup.visible=false}
 // ambience
 clouds.forEach(c=>{c.position.x+=dt*3;if(c.position.x>750)c.position.x=-750});
 gulls.forEach(g=>{const u=g.userData;u.a+=u.s*dt;g.position.set(Math.cos(u.a)*u.r,u.y+Math.sin(T+u.ph)*2,-10+Math.sin(u.a)*u.r);g.rotation.y=-u.a;u.w1.rotation.z=Math.sin(T*7+u.ph)*.7;u.w2.rotation.z=-u.w1.rotation.z});
 scene.background.copy(uw?DEEP:SKY);scene.fog.color.copy(uw?DEEP:SKY);scene.fog.density=uw?.06:.0022;skyMesh.visible=!uw;
 if(frame%2===0)waves(T);if(frame%8===0)drawHud(Math.max(0,headP.y),sp);
 renderer.render(scene,camera)});
